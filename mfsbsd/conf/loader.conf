# FluidOS Live boot configuration. Keep the mfsBSD memory-root entries.
mfs_load="YES"
mfs_type="mfs_root"
mfs_name="/mfsroot"
ahci_load="YES"
vfs.root.mountfrom="ufs:/dev/ufs/mfsroot"
mfsbsd.hostname="FluidOS-Live"
mfsbsd.autodhcp="YES"
zfs_load="YES"

# Liquid Glass splash artwork. PNG is for vt(4) loaders; BMP is retained for
# legacy syscons consoles. The bar is decorative, not a live progress meter.
splash="/boot/fluidos-splash.png"
boot_mute="YES"
splash_bmp_load="YES"
bitmap_load="YES"
bitmap_name="/boot/fluidos-splash.bmp"
loader_logo="none"
